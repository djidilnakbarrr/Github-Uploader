<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF6EE">
  <title>Sedang offline - Github-Uploader</title>
  <link rel="icon" href="/icon-192x192.png" type="image/png">
  <style>
    :root {
      --bg: #FAF6EE;
      --fg: #2B2118;
      --muted: #6F6254;
      --accent: #6B4A2B;
      --accent-fg: #FAF6EE;
      --card: #FFFFFF;
      --line: #E6DCCB;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17110C;
        --fg: #F5EFE4;
        --muted: #B5A892;
        --accent: #D8B26E;
        --accent-fg: #1A1208;
        --card: #211810;
        --line: #3A2E22;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
    }
    .art { width: 96px; height: 96px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 1.375rem; line-height: 1.3; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); font-size: 0.9375rem; }
    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      width: 100%;
      min-height: 48px;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-fg);
      font: inherit;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    button svg { width: 20px; height: 20px; flex: none; }
  </style>
</head>
<body>
  <main role="main">
    <svg class="art" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" stroke="var(--accent)"/>
      <path d="M3 3l18 18" stroke="var(--card)" stroke-width="4.5"/>
      <path d="M3 3l18 18" stroke="var(--accent)"/>
    </svg>
    <h1>Anda sedang offline</h1>
    <p>Koneksi internet tidak tersedia. Mengunggah ke GitHub membutuhkan koneksi, jadi periksa jaringan Anda lalu coba lagi.</p>
    <button type="button" id="retry">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
        <path d="M8 16H3v5"/>
      </svg>
      Coba lagi
    </button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      window.location.reload();
    });
    window.addEventListener('online', function () {
      window.location.reload();
    });
  </script>
</body>
</html>
